[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biorag"
version = "0.1.0"
description = "Retrieval-augmented QA over PubMed literature on allosteric kinase inhibitors."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "requests>=2.31",
    "sentence-transformers>=2.6",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
generation = ["anthropic>=0.40"]
chroma = ["chromadb>=0.5"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
dev = ["pytest>=8.0", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: hits NCBI E-utilities (deselect with '-m \"not network\"')",
    "model: downloads or runs the embedding model (deselect with '-m \"not model\"')",
    "llm: requires an ANTHROPIC_API_KEY and makes a paid API call",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in a default argument is the documented FastAPI idiom, not the
# mutable-default bug B008 exists to catch: FastAPI resolves it per request
# rather than evaluating it once at import. Without this, every endpoint
# signature is a lint error.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
